name: Feature request
description: Suggest an improvement to DumbSlab.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain who needs this and what they are trying to do. Leave out private workspace details.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
