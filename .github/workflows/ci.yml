name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p dumbslab-core -p dumbslab --all-targets -- -D warnings
      - run: cargo clippy -p dumbslab-worker --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test -p dumbslab-core -p dumbslab
      - name: Check web app scripts parse
        run: for f in $(find web -name '*.js'); do cp "$f" /tmp/check.mjs && node --check /tmp/check.mjs || exit 1; done
