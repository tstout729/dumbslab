name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The importer tests read zips with DecompressionStream('deflate-raw'), new in Node 20.12.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo fmt --all --check
      - run: cargo clippy -p dumbslab-core -p dumbslab --all-targets -- -D warnings
      - run: cargo clippy -p dumbslab-worker --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test -p dumbslab-core -p dumbslab
      - name: Check web app scripts parse
        run: for f in $(find web -name '*.js'); do cp "$f" /tmp/check.mjs && node --check /tmp/check.mjs || exit 1; done
      - name: Importer tests
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test 'tests/importers/*.test.mjs'
