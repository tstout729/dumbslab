# DumbSlab on Cloudflare Workers + SQLite-backed Durable Objects.
#
# This file deploys the hosted, multi-tenant dumbslab.com: the root domain is the sign-up site and
# every `name.dumbslab.com` is its own workspace. To run a single private workspace instead, set
# MULTI_TENANT = "false" and see docs/cloudflare.md.
#
#   cd crates/worker
#   npx wrangler dev --env dev             # local: http://localhost:8787, workspaces at http://acme.localhost:8787
#   npx wrangler secret put SIGNUP_SECRET  # signs sign-up links (any long random string)
#   npx wrangler secret put OPERATOR_TOKEN # unlocks the operator API (/api/operator/...)
#   npx wrangler deploy
#
# Pro goes on sale once STRIPE_PRICE_ID below is set and the STRIPE_SECRET_KEY and
# STRIPE_WEBHOOK_SECRET secrets exist (scripts/stripe-setup.sh; see docs/cloudflare.md).

name = "dumbslab"
main = "build/index.js"
compatibility_date = "2026-10-01"

routes = [
  { pattern = "dumbslab.com", custom_domain = true },
  { pattern = "www.dumbslab.com", custom_domain = true },
  # Every workspace subdomain. Needs a proxied wildcard DNS record (`*`).
  { pattern = "*.dumbslab.com/*", zone_name = "dumbslab.com" },
]

[build]
command = "worker-build --release"

# The Worker sees every request (to route by host) and hands non-API paths to the assets.
[assets]
directory = "../../web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[durable_objects.bindings]]
name = "WORKSPACE"
class_name = "Workspace"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Workspace"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Directory"]

# Requests per client network (an IPv4 address or IPv6 /64) per minute, counted before a
# workspace's object runs. Each Cloudflare location counts on its own, so it's approximate.
[[ratelimits]]
name = "REQUEST_LIMITER"
namespace_id = "20261030"
simple = { limit = 1200, period = 60 }

[vars]
MULTI_TENANT = "true"
ROOT_DOMAIN = "dumbslab.com"
# Sign-up limits that keep a free deployment free.
SIGNUPS_PER_IP_PER_DAY = "3"
SIGNUPS_PER_DAY = "200"
MAX_WORKSPACES = "1000"
# Plans. Every feature is on both; they differ in storage and in database rows written per 24
# hours. Past either, changes stop; reading and signing in keep working.
FREE_STORAGE_MB = "50"
FREE_WRITES_PER_DAY = "50000"
PRO_STORAGE_MB = "5120"
PRO_WRITES_PER_DAY = "200000"
# What all free workspaces together may use. Keep both inside what Workers Paid includes
# (50 million rows written a month, 5 GB stored); sign-ups and free writes pause past them.
FREE_TOTAL_WRITES_PER_DAY = "1000000"
FREE_TOTAL_STORAGE_MB = "4096"
# Connected apps (docs/connected-apps.md): the CONNECTOR_KEY secret turns them on; `<APP>_CLIENT_ID`
# here and the `<APP>_CLIENT_SECRET` secret let people sign in to that app, e.g. GITHUB_CLIENT_ID.
# ATLASSIAN_CLIENT_ID covers Jira and Confluence. How to register each: docs/hosting/connected-apps.md.
# Single sign-on with DumbSlab's own apps (docs/hosting/sign-in-apps.md): each client ID here, and
# its secret with `npx wrangler secret put SSO_GOOGLE_CLIENT_SECRET` (or SSO_MICROSOFT_CLIENT_SECRET).
# Slack's is the Slack app's SLACK_CLIENT_ID and SLACK_CLIENT_SECRET, which connected-app Slack uses
# too. Empty turns a provider off.
SSO_GOOGLE_CLIENT_ID = ""
SSO_MICROSOFT_CLIENT_ID = ""
STRIPE_PRICE_ID = ""
# Optional: the customer portal settings scripts/stripe-setup.sh made (bpc_…).
STRIPE_PORTAL_CONFIG = ""
PRO_PRICE_LABEL = "$8 a month"
# Single-workspace mode only: public URL and Durable Object name.
BASE_URL = ""
WORKSPACE_NAME = "main"
OPEN_SETUP = "false"
# Session recordings (Quill) and error reports (Sentry). All three are public: the web app sends
# them to browsers. Empty turns each off. web/_headers must allow both hosts in connect-src.
QUILL_HOST = "https://t.staykit.ai"
QUILL_TOKEN = "phc_G0HH1nVnPAe978r7DlSWtaGHNgk8DexefGzVjGos"
SENTRY_DSN = "https://85b018c97c1c741350b97406e8556a15@o4511072647970816.ingest.us.sentry.io/4512347076427776"

[observability]
enabled = true

# Local multi-tenant development. Uses a throwaway SIGNUP_SECRET; never deploy this environment.
[env.dev]
routes = []

[[env.dev.durable_objects.bindings]]
name = "WORKSPACE"
class_name = "Workspace"

[[env.dev.durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[env.dev.ratelimits]]
name = "REQUEST_LIMITER"
namespace_id = "20261030"
simple = { limit = 1200, period = 60 }

[env.dev.vars]
MULTI_TENANT = "true"
ROOT_DOMAIN = "localhost"
SIGNUP_SECRET = "dev-only-signup-secret"
OPERATOR_TOKEN = "dev-only-operator-token"
SIGNUPS_PER_IP_PER_DAY = "50"
SIGNUPS_PER_DAY = "500"
MAX_WORKSPACES = "1000"
FREE_STORAGE_MB = "50"
FREE_WRITES_PER_DAY = "50000"
PRO_STORAGE_MB = "5120"
PRO_WRITES_PER_DAY = "200000"
FREE_TOTAL_WRITES_PER_DAY = "1000000"
FREE_TOTAL_STORAGE_MB = "4096"
# Put a sandbox's STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET (from `stripe listen`) and
# STRIPE_PRICE_ID in crates/worker/.dev.vars to try Pro locally.
PRO_PRICE_LABEL = "$8 a month"
BASE_URL = ""
WORKSPACE_NAME = "main"
OPEN_SETUP = "false"
# Off locally. To try them, pass e.g. --var QUILL_HOST:… to `wrangler dev`.
QUILL_HOST = ""
QUILL_TOKEN = ""
SENTRY_DSN = ""
