# DumbSlab on Cloudflare Workers + SQLite-backed Durable Objects.
#
# This file deploys the hosted, multi-tenant dumbslab.com: the root domain is the sign-up site and
# every `name.dumbslab.com` is its own workspace. To run a single private workspace instead, set
# MULTI_TENANT = "false" and see docs/cloudflare.md.
#
#   cd crates/worker
#   npx wrangler dev --env dev             # local: http://localhost:8787, workspaces at http://acme.localhost:8787
#   npx wrangler secret put SIGNUP_SECRET  # signs sign-up links (any long random string)
#   npx wrangler secret put OPERATOR_TOKEN # unlocks the operator API (/api/operator/...)
#   npx wrangler deploy
#
# Pro goes on sale once the STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET and STRIPE_PRICE_ID secrets
# exist (scripts/stripe-setup.sh; see docs/cloudflare.md). Deleting STRIPE_PRICE_ID takes it off sale.

name = "dumbslab"
main = "build/index.js"
compatibility_date = "2026-10-01"

routes = [
  { pattern = "dumbslab.com", custom_domain = true },
  { pattern = "www.dumbslab.com", custom_domain = true },
  # Every workspace subdomain. Needs a proxied wildcard DNS record (`*`).
  { pattern = "*.dumbslab.com/*", zone_name = "dumbslab.com" },
]

[build]
command = "worker-build --release"

# The Worker sees every request (to route by host) and hands non-API paths to the assets.
[assets]
directory = "../../web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[durable_objects.bindings]]
name = "WORKSPACE"
class_name = "Workspace"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Workspace"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Directory"]

# Requests per client network (an IPv4 address or IPv6 /64) per minute, counted before a
# workspace's object runs. Each Cloudflare location counts on its own, so it's approximate.
[[ratelimits]]
name = "REQUEST_LIMITER"
namespace_id = "20261030"
simple = { limit = 1200, period = 60 }

# Starting a sign-in with Google, Microsoft or a workspace's single sign-on, per client network
# per minute: each one asks the provider and records the sign-in in the workspace.
[[ratelimits]]
name = "SSO_START_LIMITER"
namespace_id = "20261116"
simple = { limit = 20, period = 60 }

[vars]
MULTI_TENANT = "true"
ROOT_DOMAIN = "dumbslab.com"
# Sign-up limits that keep a free deployment free. dumbslab.com's are sized for launch traffic.
SIGNUPS_PER_IP_PER_DAY = "5"
SIGNUPS_PER_DAY = "2000"
MAX_WORKSPACES = "20000"
# Plans. Every feature is on both; they differ in storage and in database rows written per 24
# hours. Past either, changes stop; reading and signing in keep working.
FREE_STORAGE_MB = "50"
FREE_WRITES_PER_DAY = "50000"
PRO_STORAGE_MB = "5120"
PRO_WRITES_PER_DAY = "200000"
# What all free workspaces together may use; sign-ups and free writes pause past them. Workers
# Paid includes 50 million rows written a month and 5 GB stored. dumbslab.com allows more: at
# both caps for a whole month, about 90 million rows and 100 GB, roughly $60 past what's included.
FREE_TOTAL_WRITES_PER_DAY = "3000000"
FREE_TOTAL_STORAGE_MB = "102400"
# Each workspace with an active Pro subscription adds this to both totals, so the free plan grows
# with what pays for it: at most about $1.70 a month of a Pro subscription's $8.
FREE_WRITES_PER_PRO_PER_DAY = "50000"
FREE_STORAGE_MB_PER_PRO = "1024"
# Connected apps (docs/connected-apps.md): the CONNECTOR_KEY secret turns them on; `<APP>_CLIENT_ID`
# here and the `<APP>_CLIENT_SECRET` secret let people sign in to that app, e.g. GITHUB_CLIENT_ID.
# ATLASSIAN_CLIENT_ID covers Jira and Confluence. How to register each: docs/hosting/connected-apps.md.
# Single sign-on with DumbSlab's own apps (docs/hosting/sign-in-apps.md): each client ID here, and
# its secret with `npx wrangler secret put SSO_GOOGLE_CLIENT_SECRET` (or SSO_MICROSOFT_CLIENT_SECRET).
# Slack's is the Slack app's SLACK_CLIENT_ID and SLACK_CLIENT_SECRET, which connected-app Slack uses
# too. Empty turns a provider off.
# DumbSlab's registered connected apps (client IDs are public; secrets are Worker secrets):
GITHUB_CLIENT_ID = "Ov23liIgED3Qoj2ibTEg"
GOOGLE_DRIVE_CLIENT_ID = "199798423369-nksu4okslidq6teb9p1e0i0gj6f45var.apps.googleusercontent.com"
ATLASSIAN_CLIENT_ID = "1Rf6cMjPt978Li9CBAdijhSWBWrcR16w"
TRELLO_CLIENT_ID = "sB0Jywr10XeKQIIISQK2RppadkR8FjVd"
GITLAB_CLIENT_ID = "57f68e9edc78a37b7d01bb74c7690884d80926094b70d140787c541cc0d54791"
DROPBOX_CLIENT_ID = "9mnlstd4wff8cmy"
LINEAR_CLIENT_ID = "9670718c5392ead2120d8e443a3c26b3"
ASANA_CLIENT_ID = "1220532966143634"
TODOIST_CLIENT_ID = "937568aa66554bd18b69097e700a69b3"
MONDAY_CLIENT_ID = "055599618fa81cdf66fb7eafd99e341c"
CLICKUP_CLIENT_ID = "CEA4BKXE4XU28EJMM1XY8CG9AP86A2QS"
SSO_GOOGLE_CLIENT_ID = "972220925688-knk93cb3c4r86qlh21cfh4dvhrj99qog.apps.googleusercontent.com"
SSO_MICROSOFT_CLIENT_ID = "c084d4e0-271f-43de-a38b-df10d65beb7a"
# DumbSlab's Slack app (docs/hosting/slack-app.md): the same SLACK_CLIENT_ID here and SLACK_CLIENT_SECRET
# secret, with the SLACK_SIGNING_SECRET secret, also turn on Add to Slack and Slack search:
SLACK_CLIENT_ID = "12602620985329.12604479712036"
# STRIPE_PRICE_ID and the optional STRIPE_PORTAL_CONFIG are Worker secrets, not vars, so dumbslab.com
# can switch between its Stripe sandbox, live mode and "not on sale" without a deploy.
PRO_PRICE_LABEL = "$8 a month"
# DumbSlab's GitHub App, so docs sync needs no token (docs/hosting/github-app.md). Empty turns it
# off. Its client secret, private key and webhook secret are secrets: GITHUB_APP_CLIENT_SECRET,
# GITHUB_APP_PRIVATE_KEY and GITHUB_APP_WEBHOOK_SECRET.
GITHUB_APP_ID = "5750947"
GITHUB_APP_SLUG = "dumbslab"
GITHUB_APP_CLIENT_ID = "Iv23liYdv3vvSkBRRfbt"
# Single-workspace mode only: public URL and Durable Object name.
BASE_URL = ""
WORKSPACE_NAME = "main"
OPEN_SETUP = "false"
# Session recordings (Quill) and error reports (Sentry) are off unless QUILL_HOST, QUILL_TOKEN
# and SENTRY_DSN are set. They're public (the web app sends them to browsers), but dumbslab.com
# sets them as Worker secrets so a copy of this file never reports to dumbslab.com's servers:
# `npx wrangler secret put SENTRY_DSN`. web/_headers must allow both hosts in connect-src.

[observability]
enabled = true

# Local multi-tenant development. Uses a throwaway SIGNUP_SECRET; never deploy this environment.
[env.dev]
routes = []

[[env.dev.durable_objects.bindings]]
name = "WORKSPACE"
class_name = "Workspace"

[[env.dev.durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[env.dev.ratelimits]]
name = "REQUEST_LIMITER"
namespace_id = "20261030"
simple = { limit = 1200, period = 60 }

[[env.dev.ratelimits]]
name = "SSO_START_LIMITER"
namespace_id = "20261116"
simple = { limit = 20, period = 60 }

[env.dev.vars]
MULTI_TENANT = "true"
ROOT_DOMAIN = "localhost"
SIGNUP_SECRET = "dev-only-signup-secret"
OPERATOR_TOKEN = "dev-only-operator-token"
SIGNUPS_PER_IP_PER_DAY = "50"
SIGNUPS_PER_DAY = "500"
MAX_WORKSPACES = "1000"
FREE_STORAGE_MB = "50"
FREE_WRITES_PER_DAY = "50000"
PRO_STORAGE_MB = "5120"
PRO_WRITES_PER_DAY = "200000"
FREE_TOTAL_WRITES_PER_DAY = "1000000"
FREE_TOTAL_STORAGE_MB = "4096"
FREE_WRITES_PER_PRO_PER_DAY = "50000"
FREE_STORAGE_MB_PER_PRO = "1024"
# Put a sandbox's STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET (from `stripe listen`) and
# STRIPE_PRICE_ID in crates/worker/.dev.vars to try Pro locally.
PRO_PRICE_LABEL = "$8 a month"
BASE_URL = ""
WORKSPACE_NAME = "main"
OPEN_SETUP = "false"
# Off locally. To try them, pass e.g. --var QUILL_HOST:… to `wrangler dev`.
QUILL_HOST = ""
QUILL_TOKEN = ""
SENTRY_DSN = ""
