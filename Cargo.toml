[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "crates/worker"]
default-members = ["crates/core", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
description = "An open-source team knowledge base, built for people and AI agents."

[workspace.dependencies]
dumbslab-core = { path = "crates/core" }
# Only the cipher: nonces come from `rand`, so no second `getrandom` is pulled into the wasm build.
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
ammonia = "4.2.4"
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4"
hex = "0.4.3"
hmac = "0.13.0"
mime_guess = "2.0.5"
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rust-embed = { version = "8.13.0", features = ["include-exclude"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
similar = "3.2.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"

[profile.release]
lto = true
codegen-units = 1
strip = true

# wasm-bindgen reads the `target_features` section that stripping removes.
[profile.release.package.dumbslab-worker]
strip = false
